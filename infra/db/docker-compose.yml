name: giwon-blog-infra

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17
    container_name: giwon-blog-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: giwon
      POSTGRES_PASSWORD: giwon1234
      POSTGRES_DB: giwon_blog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - blog-network

  redis:
    image: redis:7-alpine
    container_name: giwon-blog-redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks:
      - blog-network

networks:
  blog-network:
    external: true

volumes:
  postgres-data:
    external: true
    name: giwon-blog-api_postgres-data
  redis-data:
    external: true
    name: giwon-blog-api_redis-data
