name: giwon-blog-reverse-proxy

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: giwon-blog-reverse-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      blog-network:
        aliases:
          - giwon-blog-api-blog
          - giwon-blog-api-admin

networks:
  blog-network:
    external: true
