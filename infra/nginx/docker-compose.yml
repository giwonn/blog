name: giwon-blog-reverse-proxy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: giwon-blog-reverse-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
      - "3001:3001"
    # 8080 / 8081 intentionally NOT published to host — API is reachable
    # only via the internal docker network (same posture as Kotlin).
    # Next.js frontends reach Hono at giwon-blog-api-blog:8080 /
    # giwon-blog-api-admin:8081 through the blog-network aliases below.
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      blog-network:
        aliases:
          - giwon-blog-api-blog
          - giwon-blog-api-admin

networks:
  blog-network:
    external: true
