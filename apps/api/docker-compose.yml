x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    container_name: api-next-dev-db
    logging: *default-logging
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: api_next_dev
      POSTGRES_USER: api_next
      POSTGRES_PASSWORD: api_next_dev_pwd
    volumes:
      - api-next-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_next -d api_next_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: api-next-dev-redis
    logging: *default-logging
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  api-next-dev-db:
