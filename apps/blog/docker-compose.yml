name: giwon-blog

services:
  blog:
    build:
      context: ../../
      dockerfile: apps/blog/Dockerfile
      args:
        - IMAGE_PUBLIC_URL=http://giwon-blog-api-blog:8080/images
    image: blog:latest
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - blog-network
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://giwon-blog-api-blog:8080
      - IMAGE_PUBLIC_URL=http://giwon-blog-api-blog:8080/images

networks:
  blog-network:
    external: true
