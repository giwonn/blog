name: giwon-blog-api-next

x-api-blog: &api-blog-common
  build:
    context: ../../
    dockerfile: apps/api-next/Dockerfile.api-blog
  restart: unless-stopped
  expose:
    - "8080"
  networks:
    - blog-network
  environment:
    DATABASE_URL: postgresql://giwon:giwon1234@giwon-blog-db:5432/giwon_blog
    REDIS_URL: redis://giwon-blog-redis:6379
    IMAGE_STORAGE_PATH: /data/blog/images
    IMAGE_PUBLIC_URL: http://giwon-blog-api-blog:8080/images
    NODE_ENV: production
    LOG_LEVEL: info
    BLOG_PORT: "8080"
    ADMIN_PORT: "8081"
  volumes:
    - blog-images:/data/blog/images
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 3

x-api-admin: &api-admin-common
  build:
    context: ../../
    dockerfile: apps/api-next/Dockerfile.api-admin
  restart: unless-stopped
  expose:
    - "8081"
  networks:
    - blog-network
  environment:
    DATABASE_URL: postgresql://giwon:giwon1234@giwon-blog-db:5432/giwon_blog
    REDIS_URL: redis://giwon-blog-redis:6379
    IMAGE_STORAGE_PATH: /data/blog/images
    IMAGE_PUBLIC_URL: http://giwon-blog-api-blog:8080/images
    NODE_ENV: production
    LOG_LEVEL: info
    BLOG_PORT: "8080"
    ADMIN_PORT: "8081"
  volumes:
    - blog-images:/data/blog/images
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
    interval: 10s
    timeout: 5s
    retries: 3

services:
  api-blog-next-blue:
    <<: *api-blog-common
    container_name: api-blog-next-blue

  api-blog-next-green:
    <<: *api-blog-common
    container_name: api-blog-next-green
    profiles: ["green"]

  api-admin-next-blue:
    <<: *api-admin-common
    container_name: api-admin-next-blue

  api-admin-next-green:
    <<: *api-admin-common
    container_name: api-admin-next-green
    profiles: ["green"]

networks:
  blog-network:
    external: true

volumes:
  blog-images:
    external: true
